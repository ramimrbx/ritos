set timeout=3
set default=0

# Load every available video backend (efi_gop/efi_uga on UEFI, vbe/vga on
# BIOS) so gfxpayload and the multiboot framebuffer tag can be satisfied.
insmod all_video

if [ "${grub_platform}" = "efi" ]; then
	menuentry "RitOS (UEFI)" {
		set gfxpayload=1920x1080x32,1280x800x32,1024x768x32,auto
		multiboot2 /boot/ritos.bin
		boot
	}
else
	menuentry "RitOS (BIOS)" {
		set gfxpayload=1920x1080x32,1280x800x32,1024x768x32,auto
		multiboot /boot/ritos.bin
		boot
	}
fi
